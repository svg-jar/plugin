<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="black" stroke-width="2">
  <!-- Background must render first -->
  <rect x="0" y="0" width="100" height="100" fill="#f0f0f0"/>

  <!-- Defs must come before their references -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="red"/>
      <stop offset="100%" stop-color="blue"/>
    </linearGradient>
    <clipPath id="clip">
      <circle cx="50" cy="50" r="40"/>
    </clipPath>
  </defs>

  <!-- Layered shapes: order determines z-index -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)" clip-path="url(#clip)"/>
  <rect x="20" y="20" width="60" height="60" fill="green" opacity="0.5"/>
  <path d="M10 90 L50 10 L90 90 Z" fill="orange" opacity="0.3"/>

  <!-- Text on top of everything -->
  <text x="50" y="55" text-anchor="middle" font-size="12" fill="white">SVG</text>
</svg>
