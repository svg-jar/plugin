<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Full circle orbit path using two semicircular arcs -->
    <path id="orbit-path" d="M 68,50 A 18,18 0 1,1 32,50 A 18,18 0 1,1 68,50"/>
  </defs>
  <!-- Orbit track -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- Sun -->
  <circle cx="50" cy="50" r="10" fill="#ff9800"/>
  <!-- Orbiting planet -->
  <circle r="5" fill="#2196f3">
    <animateMotion dur="2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orbit-path"/>
    </animateMotion>
  </circle>
</svg>
