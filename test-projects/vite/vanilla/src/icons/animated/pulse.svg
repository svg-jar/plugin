<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes pulse {
      0%, 100% { r: 20; opacity: 1; }
      50% { r: 40; opacity: 0.4; }
    }
    .dot { animation: pulse 1.5s ease-in-out infinite; }
  </style>
  <circle class="dot" cx="50" cy="50" r="20" fill="#e91e63"/>
</svg>
